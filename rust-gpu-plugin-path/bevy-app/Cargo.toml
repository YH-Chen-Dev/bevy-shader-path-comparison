[package]
name = "rust-gpu-bevy-app"
version = "0.1.0"
edition = "2021"

[[example]]
name = "case1-rust-app"
path = "apps/case1-rust-app.rs"

[[example]]
name = "case2-rust-app"
path = "apps/case2-rust-app.rs"

[dependencies]
bevy = { version = "0.10.0", features = ["spirv_shader_passthrough"] }

bevy-rust-gpu = { git = "https://github.com/bevy-rust-gpu/bevy-rust-gpu", tag = "v0.5.0" }
rust-gpu-bridge = { git = "https://github.com/bevy-rust-gpu/rust-gpu-bridge", features = ["glam"], tag = "v0.5.0" }
rust-gpu-sdf = { git = "https://github.com/bevy-rust-gpu/rust-gpu-sdf", default-features = false, features = ["glam", "bevy"] }

[patch.crates-io]
naga = { git = "https://github.com/gfx-rs/naga" }

bevy = { git = "https://github.com/bevy-rust-gpu/bevy", branch = "bevy-rust-gpu-dev" }

[profile.dev]
opt-level = 0
overflow-checks = true
debug-assertions = true
debug = true
codegen-units = 16
lto = false
incremental = true

[profile.dev.package."*"]
opt-level = 3
